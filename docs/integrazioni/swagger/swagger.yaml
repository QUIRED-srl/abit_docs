          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LicenseNotAccessible'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
