        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
        -
          $ref: '#/components/parameters/LicenseId'
        -
          $ref: '#/components/parameters/LeaderId'
        -
          $ref: '#/components/parameters/ArrivalDate'
  /api/v1/token:
    post:
      tags:
        - Authentication
      summary: 'Issue an integration token'
